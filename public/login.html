<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>Login — Forum FJB ReyCode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-[#050505] text-white font-sans antialiased">

  <div class="min-h-screen flex items-center justify-center px-5 py-10">
    <main class="w-full max-w-md">

      <div class="text-center mb-8">
        <div class="mx-auto mb-5 w-16 h-16 rounded-2xl bg-white text-black flex items-center justify-center text-2xl font-black shadow-2xl">
          R
        </div>

        <h1 class="text-3xl font-bold tracking-tight">
          Selamat Datang
        </h1>

        <p class="mt-2 text-sm text-zinc-500">
          Login ke Forum FJB ReyCode
        </p>
      </div>

      <section class="rounded-3xl border border-zinc-800 bg-zinc-950/90 p-6 shadow-2xl">

        <div id="alert" class="hidden mb-5 rounded-2xl border px-4 py-3 text-sm"></div>

        <form id="loginForm" class="space-y-5">

          <div>
            <label for="login" class="block mb-2 text-sm font-medium text-zinc-300">
              Username atau Email
            </label>

            <input
              id="login"
              name="login"
              type="text"
              autocomplete="username"
              required
              placeholder="Username atau email"
              class="w-full rounded-2xl border border-zinc-800 bg-black px-4 py-3.5 text-sm text-white outline-none transition focus:border-zinc-500"
            >
          </div>

          <div>
            <label for="password" class="block mb-2 text-sm font-medium text-zinc-300">
              Password
            </label>

            <div class="relative">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
                placeholder="Masukkan password"
                class="w-full rounded-2xl border border-zinc-800 bg-black px-4 py-3.5 pr-16 text-sm text-white outline-none transition focus:border-zinc-500"
              >

              <button
                id="togglePassword"
                type="button"
                class="absolute right-3 top-1/2 -translate-y-1/2 rounded-xl px-3 py-2 text-xs text-zinc-500 hover:text-white transition"
              >
                Lihat
              </button>
            </div>
          </div>

          <button
            id="submitButton"
            type="submit"
            class="w-full rounded-2xl bg-white px-4 py-3.5 text-sm font-bold text-black transition hover:bg-zinc-200 active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-50"
          >
            <span id="submitText">Login</span>
            <span id="loadingText" class="hidden">Memproses...</span>
          </button>

        </form>

        <div class="my-6 flex items-center gap-4">
          <div class="h-px flex-1 bg-zinc-900"></div>
          <span class="text-xs text-zinc-700">ATAU</span>
          <div class="h-px flex-1 bg-zinc-900"></div>
        </div>

        <p class="text-center text-sm text-zinc-500">
          Belum punya akun?
          <a
            href="/register.html"
            class="font-semibold text-white hover:text-zinc-300 transition"
          >
            Daftar
          </a>
        </p>

      </section>

      <p class="mt-6 text-center text-xs text-zinc-700">
        Forum FJB ReyCode
      </p>

    </main>
  </div>

  <script>
    const form = document.getElementById('loginForm')
    const alertBox = document.getElementById('alert')
    const submitButton = document.getElementById('submitButton')
    const submitText = document.getElementById('submitText')
    const loadingText = document.getElementById('loadingText')

    const loginInput = document.getElementById('login')
    const passwordInput = document.getElementById('password')
    const togglePassword = document.getElementById('togglePassword')

    function showAlert(message, type = 'error') {
      alertBox.className =
        'mb-5 rounded-2xl border px-4 py-3 text-sm'

      if (type === 'success') {
        alertBox.classList.add(
          'border-emerald-900',
          'bg-emerald-950/30',
          'text-emerald-400'
        )
      } else {
        alertBox.classList.add(
          'border-red-900',
          'bg-red-950/30',
          'text-red-400'
        )
      }

      alertBox.textContent = message
      alertBox.classList.remove('hidden')
    }

    function hideAlert() {
      alertBox.classList.add('hidden')
      alertBox.textContent = ''
    }

    function setLoading(loading) {
      submitButton.disabled = loading

      if (loading) {
        submitText.classList.add('hidden')
        loadingText.classList.remove('hidden')
      } else {
        submitText.classList.remove('hidden')
        loadingText.classList.add('hidden')
      }
    }

    togglePassword.addEventListener('click', () => {
      const isPassword =
        passwordInput.type === 'password'

      passwordInput.type =
        isPassword ? 'text' : 'password'

      togglePassword.textContent =
        isPassword ? 'Sembunyikan' : 'Lihat'
    })

    const params = new URLSearchParams(
      window.location.search
    )

    if (params.get('registered') === '1') {
      showAlert(
        'Akun berhasil dibuat. Silakan login.',
        'success'
      )
    }

    form.addEventListener('submit', async event => {
      event.preventDefault()

      hideAlert()

      const login =
        loginInput.value.trim()

      const password =
        passwordInput.value

      if (!login) {
        showAlert(
          'Username atau email wajib diisi.'
        )
        loginInput.focus()
        return
      }

      if (!password) {
        showAlert(
          'Password wajib diisi.'
        )
        passwordInput.focus()
        return
      }

      setLoading(true)

      try {
        const response = await fetch(
          '/api/auth/login',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            credentials: 'include',
            body: JSON.stringify({
              login,
              password
            })
          }
        )

        let data

        try {
          data = await response.json()
        } catch {
          data = {
            status: false,
            message: 'Response server tidak valid'
          }
        }

        if (!response.ok || !data.status) {
          showAlert(
            data.message ||
            'Login gagal.'
          )
          return
        }

        showAlert(
          'Login berhasil. Mengarahkan...',
          'success'
        )

        setTimeout(() => {
          window.location.href = '/'
        }, 700)

      } catch (error) {
        showAlert(
          'Tidak dapat terhubung ke server. Silakan coba lagi.'
        )
      } finally {
        setLoading(false)
      }
    })
  </script>

</body>
</html>
